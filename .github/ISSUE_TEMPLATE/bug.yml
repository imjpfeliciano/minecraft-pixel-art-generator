name: Bug report
description: Something is broken
labels: ["type/fix", "status/needs-triage"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route affected
      placeholder: /create
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      description: Theming bugs are frequently one-sided — check both.
      options: [light, dark, both, not theme related]
  - type: dropdown
    id: locale
    attributes:
      label: Locale
      description: Missing translations only show in one locale.
      options: [en, es, both, not locale related]
  - type: input
    id: browser
    attributes:
      label: Browser / OS
